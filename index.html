<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你好</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    font-family:system-ui,-apple-system,"PingFang SC",sans-serif; padding:20px;
  }
  .card {
    background:rgba(255,255,255,.96); border-radius:20px; padding:40px 36px;
    max-width:380px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .avatar {
    width:90px; height:90px; border-radius:50%; margin:0 auto 20px;
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex; align-items:center; justify-content:center; font-size:40px;
  }
  h1 { font-size:22px; margin-bottom:8px; color:#333; }
  p  { color:#777; font-size:14px; line-height:1.7; }
  .btn {
    display:inline-block; margin-top:24px; padding:10px 28px; border-radius:999px;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff; text-decoration:none; font-size:14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">👋</div>
    <h1>你好，我是 ZMP</h1>
    <p>这是我的第一个 GitHub Pages 页面<br>由 AI 帮我写的 🎉</p>
    <a class="btn" href="https://github.com/helpzmp-cmyk">去我的 GitHub 看看</a>

</html>
